name: Distribute to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-and-build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Cache Godot Editor & Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Application Support/Godot/
            /usr/local/bin/godot
          key: ${{ runner.os }}-godot-v4.6

      - name: Setup Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip
          unzip Godot_v4.6-stable_macos.universal.zip
          mv Godot.app /Applications/
          ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.stable
          curl -LO https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip Godot_v4.6-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/Library/Application\ Support/Godot/export_templates/4.6.stable/
          rm -rf /tmp/templates Godot_v4.6-stable_export_templates.tpz

      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/KedaiMania.xcodeproj

      - name: Run Fastlane Pipeline
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: "https://${{ secrets.MATCH_GITHUB_USERNAME }}:${{ secrets.MATCH_GIT_TOKEN }}@github.com/${{ secrets.MATCH_GITHUB_USERNAME }}/${{ secrets.MATCH_GITHUB_REPO }}.git"
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          fastlane deploy_testflight

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KedaiMania-ipa
          path: build/ios/*.ipa
          retention-days: 30

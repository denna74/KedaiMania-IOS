name: Distribute to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-and-build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Cache Godot Editor & Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/
            ~/Library/Application Support/Godot/
          key: ${{ runner.os }}-godot-v4.7

      - name: Setup Godot Engine
        run: |
          mkdir -p "$HOME/godot/bin"
          if [ ! -x "$HOME/godot/Godot.app/Contents/MacOS/Godot" ]; then
            curl -L --fail -o "$RUNNER_TEMP/Godot.zip" \
              https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip
            rm -rf "$RUNNER_TEMP/Godot" "$HOME/godot/Godot.app"
            mkdir -p "$RUNNER_TEMP/Godot"
            unzip -q "$RUNNER_TEMP/Godot.zip" -d "$RUNNER_TEMP/Godot"
            mv "$RUNNER_TEMP/Godot/Godot.app" "$HOME/godot/Godot.app"
          fi
          ln -sf "$HOME/godot/Godot.app/Contents/MacOS/Godot" "$HOME/godot/bin/godot"
          echo "$HOME/godot/bin" >> "$GITHUB_PATH"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          if [ -z "$(find ~/Library/Application\ Support/Godot/export_templates/4.7.stable -mindepth 1 -print -quit)" ]; then
            curl -L --fail -o "$RUNNER_TEMP/Godot_templates.tpz" \
              https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
            rm -rf "$RUNNER_TEMP/templates"
            unzip -q "$RUNNER_TEMP/Godot_templates.tpz" -d "$RUNNER_TEMP/templates"
            mv "$RUNNER_TEMP/templates/templates/"* ~/Library/Application\ Support/Godot/export_templates/4.7.stable/
          fi

      - name: Import Code Signing Certificate
        env:
          BUILD_CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_P12 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$BUILD_CERTIFICATE_P12" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Cache Unity Ads iOS Plugin
        id: cache-unity-ads
        uses: actions/cache@v4
        with:
          path: |
            ios/plugins/unity-ads/bin/
            ios/plugins/unity-ads/vendor/
          key: ${{ runner.os }}-unity-ads-4.18.1-${{ hashFiles('ios/plugins/unity-ads/build.sh', 'ios/plugins/unity-ads/src/**', 'ios/plugins/unity-ads/unity-ads.gdip') }}

      - name: Compile Unity Ads iOS Plugin
        if: steps.cache-unity-ads.outputs.cache-hit != 'true'
        run: |
          brew install scons
          chmod +x ./ios/plugins/unity-ads/build.sh
          ./ios/plugins/unity-ads/build.sh
        env:
          UNITY_ADS_SDK_URL: ${{ secrets.UNITY_ADS_SDK_URL }}
          UNITY_ADS_VERSION: ${{ secrets.UNITY_ADS_VERSION }}

      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --import
          godot --headless --export-release "iOS" build/ios/KedaiMania.xcodeproj

      - name: Run Fastlane Pipeline
        run: fastlane ios deploy_testflight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

      - name: Verify IPA Bundle Identifier
        run: |
          rm -rf "$RUNNER_TEMP/kedai-ipa-check"
          mkdir -p "$RUNNER_TEMP/kedai-ipa-check"
          unzip -q build/ios/KedaiMania.ipa -d "$RUNNER_TEMP/kedai-ipa-check"
          APP_PATH=$(find "$RUNNER_TEMP/kedai-ipa-check/Payload" -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found inside the IPA"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "IPA bundle identifier: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.kedaimania" ]; then
            echo "::error::Unexpected IPA bundle identifier: $BUNDLE_ID"
            exit 1
          fi

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KedaiMania-ipa
          path: build/ios/*.ipa
          retention-days: 30

name: Initialize Certificates

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Run Fastlane Init Certificates
        run: fastlane ios init_certificates
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

      - name: Set Password on Certificate
        run: |
          P12_FILE=$(ls build/certs/*.p12)
          openssl pkcs12 -in "$P12_FILE" -out /tmp/cert.pem -nodes -passin pass: -legacy
          openssl pkcs12 -export -in /tmp/cert.pem -inkey /tmp/cert.pem -out "$P12_FILE" -passout pass:KedaiMania2026! -legacy
          rm /tmp/cert.pem

      - name: Upload Certificate Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-certificates
          path: |
            build/certs/*.p12
            build/certs/*.cer
          retention-days: 30
